{% extends 'base.html' %}
{% block content %}

<form action="/submit-new-post" method="POST">
    <label for="post-title">Title</label>
    <input type="text" name="title" id="post-title">

    <label for="post-text">Text</label>
    <textarea name="text" id="post-text" placeholder="write your post here"></textarea>

    <button type="submit">Submit</button>
</form>

{% endblock %}
