{% extends 'base.html' %}
{% block content %}

<form action="{{ url_for('submit_new_blog_post') }}" method="POST">

    <label for="post-title">Title</label>
    <input type="text" name="title" id="post-title" placeholder="Post title">

    <label for="post-text">Text</label>
    <textarea name="text" id="post-text" placeholder="Write your post here"></textarea>

    <button type="submit" class="blog-button">Submit New Post</button>

</form>

{% endblock %}
