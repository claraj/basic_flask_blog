{% extends 'base.html' %}
{% block content %}

<h2>Your Posts</h2>

<a href="{{ url_for('create_new_post')}}">Create a new post</a>

{% if posts %}

    {% for post in posts %}

        <h3 class="post-title">{{ post.title }}</h3>
        <p class="post-date">{{ post.timestamp.strftime('%m %b %Y at %H:%M')}} </p>
        <p class="post-text">{{ post.text }}</p>

    {% endfor %}



{% else %}

<p>No posts yet.</p>

{% endif %}

{% endblock %}
